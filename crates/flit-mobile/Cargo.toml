[package]
name = "flit-mobile"
description = "The Android surface of Flit: three verbs over the engine, bound with UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "flit_mobile"
# The phone loads a cdylib; the lib target lets the workspace tests compile it
# on every platform.
crate-type = ["cdylib", "lib"]

[features]
# Only the bindings generator needs the CLI; the app never pays for it.
cli = ["uniffi/cli"]

[dependencies]
flit-api = { workspace = true }
flit-core = { workspace = true }
flit-crypto = { workspace = true }
flit-discovery = { workspace = true }
if-addrs = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = "0.29"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
