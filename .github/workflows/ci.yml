name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release

  # The shell is its own workspace, so this job is the only thing that compiles
  # it. Webkit and GTK come from apt; everything else comes from Cargo.lock.
  desktop:
    name: desktop (tauri)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev patchelf
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `generate_context!` reads the built frontend, so the web build comes first.
      - name: Frontend
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Test
        run: cargo test
        working-directory: apps/desktop/src-tauri

  # A file someone can download and run. NSIS is per-user on purpose: no
  # administrator prompt, no Program Files, and no firewall rule written behind
  # the user's back. The portable zip is the fallback for machines where an
  # installer is not allowed at all.
  package:
    name: package (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Frontend
        run: |
          npm ci
          npm run build

      # The WebView2 bootstrapper downloads the runtime where Windows 10 does
      # not have it; Windows 11 always does. An offline install is what the
      # portable zip is for.
      - name: Installer
        run: npm run tauri build -- --bundles nsis

      - name: Portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = "Flit-$version-windows-x64"
          $out = "src-tauri/target/release/$name"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item src-tauri/target/release/flit-desktop.exe $out
          Copy-Item ../../README.md $out/README.md
          Compress-Archive -Path "$out/*" -DestinationPath "src-tauri/target/release/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: flit-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/Flit-*-windows-x64.zip
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
