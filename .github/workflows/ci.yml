name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release

  # The shell is its own workspace, so this job is the only thing that compiles
  # it. Webkit and GTK come from apt; everything else comes from Cargo.lock.
  desktop:
    name: desktop (tauri)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev patchelf
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `generate_context!` reads the built frontend, so the web build comes first.
      - name: Frontend
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Test
        run: cargo test
        working-directory: apps/desktop/src-tauri

  # A file someone can download and run. NSIS is per-user on purpose: no
  # administrator prompt, no Program Files, and no firewall rule written behind
  # the user's back. The portable zip is the fallback for machines where an
  # installer is not allowed at all.
  package:
    name: package (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Frontend
        run: |
          npm ci
          npm run build

      # The WebView2 bootstrapper downloads the runtime where Windows 10 does
      # not have it; Windows 11 always does. An offline install is what the
      # portable zip is for.
      - name: Installer
        run: npm run tauri build -- --bundles nsis

      - name: Portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = "Flit-$version-windows-x64"
          $out = "src-tauri/target/release/$name"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item src-tauri/target/release/flit-desktop.exe $out
          Copy-Item ../../README.md $out/README.md
          Compress-Archive -Path "$out/*" -DestinationPath "src-tauri/target/release/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: flit-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/Flit-*-windows-x64.zip
          if-no-files-found: error

  # The phone is a peer like any other: the same engine, bound through UniFFI
  # and packed into an APK. The NDK is the runner's, not the repo's, and the
  # bindings are generated from a debug host library because the release one is
  # stripped — and stripping removes the metadata symbols the generator reads.
  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: gradle/actions/setup-gradle@v4

      - name: Bindings generator
        run: cargo install cargo-ndk --locked --version 4.1.2

      # Host build first: the Kotlin surface comes from a Linux cdylib, and it
      # must be the debug one, unstripped.
      - name: Kotlin bindings
        run: |
          cargo build -p flit-mobile --features cli
          cargo run -p flit-mobile --features cli --bin uniffi-bindgen -- \
            generate --library target/debug/libflit_mobile.so \
            --language kotlin \
            --out-dir apps/android/app/src/main/java \
            --no-format

      - name: Native libraries
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 26 \
            -o apps/android/app/src/main/jniLibs \
            build --release -p flit-mobile

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/android

      - uses: actions/upload-artifact@v4
        with:
          name: flit-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A tag ships the release build, signed with the one key that must not
      # change: that signature is what lets the next version install over this
      # one. The key is base64 in a secret, and the job fails loudly rather than
      # publishing an unsigned APK on a tag.
      - name: Release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; a tag needs the release key." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flit-release.jks"

      - name: Signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        env:
          FLIT_KEYSTORE: ${{ runner.temp }}/flit-release.jks
          FLIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: flit-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # A tag is the only thing that publishes. Everything here is built by the jobs
  # above on the same commit, so the release holds exactly what CI passed, and a
  # red run publishes nothing. The assets are renamed to the tag's version so a
  # person downloading one can see what they have.
  #
  # This is marked a pre-release on purpose: the Windows installer is still
  # unsigned, which the release notes and the site both say. The APK is signed
  # with the project's release key, so a later version installs over this one;
  # that key is in CI secrets, not in the repository.
  release:
    name: release
    needs: [test, desktop, package, android, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect and name the assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/Flit-*-windows-x64.zip "out/Flit-$version-windows-x64.zip"
          cp dist/bundle/nsis/*.exe "out/Flit-$version-windows-x64-setup.exe"
          cp dist/app-release.apk "out/Flit-$version-android.apk"
          cd out
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flit ${GITHUB_REF_NAME#v} preview" \
            --prerelease \
            --generate-notes

